<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vitala — 症狀檢查 · Understand. Decide. Feel better.</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4668297380257099"
     crossorigin="anonymous"></script>
<style>
  :root {
    --mint-50: #F2F8F5;
    --mint-100: #E1F0EA;
    --mint-200: #C5E2D7;
    --mint-300: #9FCDBC;
    --mint-400: #6FB39C;
    --mint-500: #4F9985;
    --mint-600: #3F7D6D;
    --mint-700: #305F54;
    --cream: #FAF7F0;
    --ink-900: #1F2A28;
    --ink-700: #43504D;
    --ink-500: #6E7A77;
    --ink-300: #A9B2B0;
    --line: #E6EBE8;
    --red: #D45B5B;
    --red-bg: #FBEEEE;
    --red-strong: #B83A3A;
    --amber: #D9963F;
    --amber-bg: #FBF3E4;
    --amber-strong: #8B6020;
    --green: #4F9985;
    --green-bg: #E7F2ED;
    --green-strong: #2E6E5B;
    --shadow-sm: 0 1px 2px rgba(48,95,84,.06), 0 2px 8px rgba(48,95,84,.04);
    --shadow-md: 0 4px 12px rgba(48,95,84,.08), 0 12px 32px rgba(48,95,84,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--cream);
    color: var(--ink-900);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a { color: inherit; text-decoration: none; }
  input, textarea { font-family: inherit; }

  .app {
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--cream);
    position: relative;
    box-shadow: 0 0 60px rgba(48,95,84,0.04);
    overflow: hidden;
  }
  .scroll-area { padding-bottom: 96px; }

  /* ===== Top bar ===== */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(250,247,240,0.92);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 10px;
    min-height: 56px;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-mark {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--mint-300), var(--mint-500));
    border-radius: 9px;
    display: grid; place-items: center;
    box-shadow: var(--shadow-sm);
  }
  .brand-mark svg { width: 20px; height: 20px; }
  .brand-name {
    font-size: 19px; font-weight: 700; letter-spacing: -0.4px;
    color: var(--mint-700);
  }
  .topbar .back {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    color: var(--ink-700);
    transition: background .15s;
  }
  .topbar .back:hover { background: var(--mint-100); }
  .topbar .title {
    font-size: 16px; font-weight: 600; color: var(--ink-900);
    flex: 1;
  }
  .topbar .right {
    font-size: 13px; color: var(--mint-600); font-weight: 600;
    padding: 6px 10px; border-radius: 8px;
  }

  /* ===== Splash ===== */
  .splash {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #DEEBE2 0%, #F2F8F5 50%, #E9F4ED 100%);
    display: grid; place-items: center;
    z-index: 200;
    animation: splashOut .6s ease 1.4s forwards;
  }
  .splash-inner {
    text-align: center; animation: splashIn .8s ease both;
  }
  .splash-logo {
    width: 88px; height: 88px;
    background: linear-gradient(135deg, var(--mint-300), var(--mint-500));
    border-radius: 24px;
    display: grid; place-items: center;
    margin: 0 auto 18px;
    box-shadow: 0 12px 40px rgba(80,153,133,0.3);
  }
  .splash-logo svg { width: 52px; height: 52px; }
  .splash-name {
    font-size: 36px; font-weight: 700; letter-spacing: -1px;
    color: var(--mint-700); margin-bottom: 6px;
  }
  .splash-tag {
    font-size: 13px; color: var(--ink-500); letter-spacing: 0.5px;
  }
  @keyframes splashIn { from { opacity: 0; transform: translateY(10px) scale(0.96); } to { opacity: 1; transform: none; } }
  @keyframes splashOut { to { opacity: 0; visibility: hidden; pointer-events: none; } }

  /* ===== Onboarding ===== */
  .onb {
    min-height: 100vh; display: flex; flex-direction: column;
    background: linear-gradient(180deg, #F2F8F5 0%, var(--cream) 50%);
    padding: 60px 28px 32px;
  }
  .onb-skip {
    position: absolute; top: 18px; right: 20px;
    color: var(--ink-500); font-size: 14px; font-weight: 500;
    padding: 8px 14px; border-radius: 999px;
  }
  .onb-stage {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 8px;
  }
  .onb-icon {
    width: 100px; height: 100px;
    background: #fff;
    border-radius: 32px;
    display: grid; place-items: center;
    margin-bottom: 32px;
    box-shadow: 0 8px 32px rgba(80,153,133,0.12);
  }
  .onb-icon svg { width: 52px; height: 52px; color: var(--mint-500); }
  .onb h2 {
    font-size: 24px; line-height: 1.4; color: var(--mint-700);
    letter-spacing: -0.5px; margin-bottom: 12px;
  }
  .onb p {
    font-size: 15px; color: var(--ink-700); line-height: 1.7;
    max-width: 320px;
  }
  .onb-dots { display: flex; gap: 8px; justify-content: center; margin: 24px 0; }
  .onb-dots span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--mint-200); transition: all .25s;
  }
  .onb-dots span.active { background: var(--mint-500); width: 22px; border-radius: 4px; }

  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--mint-500), var(--mint-600));
    color: #fff;
    border-radius: 14px;
    padding: 16px;
    font-size: 16px; font-weight: 600;
    box-shadow: 0 4px 16px rgba(80,153,133,0.3);
    transition: transform .12s, box-shadow .15s;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary.lg { padding: 18px; font-size: 17px; }
  .btn-secondary {
    width: 100%;
    background: #fff;
    color: var(--mint-700);
    border: 1.5px solid var(--mint-200);
    border-radius: 14px;
    padding: 14px;
    font-size: 15px; font-weight: 600;
  }
  .btn-secondary:active { transform: scale(0.99); }
  .btn-ghost {
    width: 100%;
    background: transparent; color: var(--ink-500);
    padding: 12px; font-size: 14px;
  }
  .btn-danger {
    width: 100%;
    background: var(--red); color: #fff;
    border-radius: 14px;
    padding: 16px;
    font-size: 16px; font-weight: 700;
    box-shadow: 0 4px 16px rgba(212,91,91,0.3);
  }

  /* ===== Home ===== */
  .home-hero {
    padding: 28px 24px 24px;
    background:
      radial-gradient(120% 80% at 100% 0%, var(--mint-100) 0%, transparent 50%),
      radial-gradient(80% 60% at 0% 100%, #EFF5E8 0%, transparent 60%);
    border-bottom: 1px solid var(--line);
  }
  .home-hero h1 {
    font-size: 26px; line-height: 1.3; letter-spacing: -0.5px;
    color: var(--mint-700); font-weight: 700; margin-bottom: 6px;
  }
  .home-hero h1 small {
    display: block; font-size: 13px; font-weight: 500;
    color: var(--ink-500); letter-spacing: 0; margin-top: 4px;
  }
  .home-hero p {
    color: var(--ink-700); font-size: 14px; margin-top: 10px;
  }
  .home-cta-wrap { padding: 20px; display: flex; flex-direction: column; gap: 10px; }

  /* ===== Section ===== */
  section.block { padding: 18px 20px 4px; }
  .block-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 12px;
  }
  .block-head h2 {
    font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
    color: var(--ink-500); text-transform: uppercase;
  }
  .block-head a {
    font-size: 13px; color: var(--mint-600); font-weight: 600;
  }

  /* ===== History on home ===== */
  .history-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 8px;
  }
  .hist-light {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
  }
  .hist-light.green { background: var(--green); }
  .hist-light.amber { background: var(--amber); }
  .hist-light.red { background: var(--red); }
  .hist-text { flex: 1; min-width: 0; }
  .hist-name { font-weight: 600; font-size: 14.5px; }
  .hist-meta { font-size: 12px; color: var(--ink-500); margin-top: 2px; }

  /* ===== Symptom list (browse) ===== */
  .sym-list { display: flex; flex-direction: column; gap: 8px; }
  .sym-item {
    width: 100%;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    text-align: left;
    transition: border-color .15s, transform .12s;
  }
  .sym-item:active { transform: scale(0.99); }
  .sym-item:hover { border-color: var(--mint-300); }
  .sym-emoji {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--mint-100);
    display: grid; place-items: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .sym-text { flex: 1; min-width: 0; }
  .sym-name { font-weight: 600; font-size: 15px; }
  .sym-desc { font-size: 12.5px; color: var(--ink-500); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sym-arrow { color: var(--ink-300); flex-shrink: 0; }

  /* ===== Categories ===== */
  .cat-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
  }
  .cat-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 14px;
    text-align: left;
    transition: border-color .15s, transform .12s;
    display: flex; flex-direction: column; gap: 8px;
  }
  .cat-card:active { transform: scale(0.98); }
  .cat-icon {
    width: 38px; height: 38px; border-radius: 11px;
    background: var(--mint-100); color: var(--mint-600);
    display: grid; place-items: center;
  }
  .cat-name { font-size: 15px; font-weight: 600; }
  .cat-count { font-size: 12px; color: var(--ink-500); }

  /* ===== Red-flag screen ===== */
  .rf-wrap { padding: 24px 22px 20px; }
  .rf-head {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--red-bg);
    border: 1px solid #ECCACA;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .rf-head .ico {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--red); color: #fff;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .rf-head h3 { font-size: 16px; color: var(--red-strong); margin-bottom: 4px; }
  .rf-head p { font-size: 13px; color: #6F4040; line-height: 1.6; }
  .rf-list {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .rf-item {
    padding: 14px 16px;
    display: flex; gap: 12px; align-items: flex-start;
    border-bottom: 1px solid var(--line);
  }
  .rf-item:last-child { border-bottom: 0; }
  .rf-item .num {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--red-bg); color: var(--red-strong);
    font-size: 13px; font-weight: 700;
    display: grid; place-items: center; flex-shrink: 0; margin-top: 1px;
  }
  .rf-item .txt { font-size: 14.5px; color: var(--ink-900); line-height: 1.55; }
  .rf-actions { display: flex; flex-direction: column; gap: 10px; }

  /* ===== Quiz ===== */
  .quiz-progress {
    height: 4px; background: var(--line);
    position: sticky; top: 56px; z-index: 49;
  }
  .quiz-progress > span {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--mint-400), var(--mint-500));
    transition: width .3s;
  }
  .quiz-wrap { padding: 28px 22px 24px; }
  .quiz-step { font-size: 12.5px; color: var(--ink-500); margin-bottom: 8px; letter-spacing: 0.5px; }
  .quiz-q {
    font-size: 21px; line-height: 1.45; font-weight: 700;
    color: var(--ink-900); letter-spacing: -0.3px; margin-bottom: 8px;
  }
  .quiz-hint {
    font-size: 13.5px; color: var(--ink-500); line-height: 1.6; margin-bottom: 22px;
  }
  .opt-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .opt {
    width: 100%;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    text-align: left;
    font-size: 15px; font-weight: 500; color: var(--ink-900);
    display: flex; align-items: center; gap: 14px;
    transition: all .15s;
  }
  .opt:hover, .opt:focus { border-color: var(--mint-300); background: var(--mint-50); }
  .opt.selected {
    border-color: var(--mint-500); background: var(--mint-50);
    box-shadow: 0 0 0 3px rgba(80,153,133,0.15);
  }
  .opt .check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--ink-300);
    display: grid; place-items: center;
    flex-shrink: 0; transition: all .15s;
  }
  .opt.selected .check {
    background: var(--mint-500); border-color: var(--mint-500);
  }
  .opt.selected .check svg { color: #fff; opacity: 1; }
  .opt .check svg { width: 14px; height: 14px; color: transparent; opacity: 0; transition: opacity .15s; }
  .opt.multi .check { border-radius: 6px; }

  .quiz-actions { display: flex; gap: 10px; }
  .quiz-actions .btn-secondary { flex: 0 0 auto; width: auto; padding: 14px 22px; }
  .quiz-actions .btn-primary { flex: 1; }

  /* ===== Demographic chips ===== */
  .demo-section { margin-bottom: 22px; }
  .demo-label { font-size: 13px; color: var(--ink-500); margin-bottom: 10px; font-weight: 600; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-btn {
    padding: 10px 16px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    font-size: 14px; font-weight: 500;
    color: var(--ink-700);
    transition: all .15s;
  }
  .chip-btn.selected {
    background: var(--mint-500); color: #fff; border-color: var(--mint-500);
  }

  /* ===== Result page ===== */
  .result-wrap { padding: 16px 20px 32px; }
  .result-banner {
    border-radius: 24px;
    padding: 24px 22px 22px;
    margin-bottom: 18px;
    color: #fff;
    position: relative; overflow: hidden;
  }
  .result-banner::before {
    content: ""; position: absolute; right: -40px; top: -40px;
    width: 180px; height: 180px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
  }
  .result-banner::after {
    content: ""; position: absolute; left: -30px; bottom: -50px;
    width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .result-banner.green { background: linear-gradient(135deg, #5FA48F, #3F7D6D); }
  .result-banner.amber { background: linear-gradient(135deg, #E0A856, #B07626); }
  .result-banner.red { background: linear-gradient(135deg, #DD6868, #B83A3A); }
  .result-banner .light-tag {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.2);
    padding: 6px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
    margin-bottom: 12px;
    position: relative; z-index: 1;
  }
  .result-banner .light-tag .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #fff;
  }
  .result-banner h1 {
    font-size: 24px; line-height: 1.35; letter-spacing: -0.4px;
    margin-bottom: 8px; position: relative; z-index: 1;
  }
  .result-banner p {
    font-size: 14.5px; line-height: 1.65; opacity: 0.95;
    position: relative; z-index: 1;
  }

  .result-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .result-card h3 {
    font-size: 14.5px; font-weight: 700; color: var(--ink-900);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .result-card h3 .ico {
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--mint-100); color: var(--mint-600);
    display: grid; place-items: center;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--mint-100); color: var(--mint-700);
    border: 1px solid var(--mint-200);
    padding: 8px 14px; border-radius: 999px;
    font-size: 13.5px; font-weight: 600;
  }
  .chip.alt { background: #fff; color: var(--ink-700); border-color: var(--line); }

  .qlist { counter-reset: q; display: flex; flex-direction: column; gap: 10px; }
  .qitem {
    counter-increment: q;
    background: var(--mint-50);
    border: 1px solid var(--mint-200);
    border-radius: 12px;
    padding: 12px 14px 12px 44px;
    position: relative;
    font-size: 14px; line-height: 1.55;
  }
  .qitem::before {
    content: counter(q);
    position: absolute; left: 12px; top: 12px;
    width: 24px; height: 24px;
    background: var(--mint-500); color: #fff;
    font-size: 12px; font-weight: 700;
    border-radius: 50%;
    display: grid; place-items: center;
  }

  ul.bullet { list-style: none; }
  ul.bullet li {
    position: relative; padding-left: 18px;
    font-size: 14px; color: var(--ink-700); line-height: 1.7;
  }
  ul.bullet li::before {
    content: ""; position: absolute; left: 4px; top: 12px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--mint-400);
  }

  .watch-card {
    background: var(--amber-bg);
    border: 1px solid #EFD9B0;
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .watch-card h3 { color: var(--amber-strong); font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .watch-card ul li { color: #6E5C29; font-size: 13.5px; }
  .watch-card ul li::before { background: var(--amber); }

  .disclaimer {
    margin-top: 12px;
    padding: 14px 16px;
    background: #FBF5E8;
    border: 1px solid #EBDDB7;
    border-radius: 14px;
    font-size: 12.5px; color: #6E5C29; line-height: 1.6;
  }
  .disclaimer strong { color: var(--amber-strong); }

  .result-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }

  /* ===== Detail (browse) ===== */
  .detail { padding: 16px 20px 32px; }
  .detail-hero {
    background: linear-gradient(135deg, var(--mint-100), #E9F2EB);
    border-radius: 24px;
    padding: 22px 22px 24px;
    margin-bottom: 18px;
    position: relative; overflow: hidden;
  }
  .detail-emoji { font-size: 38px; line-height: 1; margin-bottom: 8px; }
  .detail-title { font-size: 24px; font-weight: 700; color: var(--mint-700); }
  .detail-sub { color: var(--ink-700); font-size: 14px; margin-top: 6px; }

  .lights { display: flex; flex-direction: column; gap: 10px; }
  .light {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .light .dot {
    width: 14px; height: 14px; border-radius: 50%;
    flex-shrink: 0; margin-top: 4px;
    box-shadow: 0 0 0 3px rgba(255,255,255,1), 0 0 0 4px var(--line);
  }
  .light.green-l { background: var(--green-bg); border-color: #C9E2D5; }
  .light.green-l .dot { background: var(--green); }
  .light.amber-l { background: var(--amber-bg); border-color: #EFD9B0; }
  .light.amber-l .dot { background: var(--amber); }
  .light.red-l { background: var(--red-bg); border-color: #ECCACA; }
  .light.red-l .dot { background: var(--red); }
  .light .lbl { font-weight: 700; font-size: 13.5px; }
  .light.green-l .lbl { color: var(--green-strong); }
  .light.amber-l .lbl { color: var(--amber-strong); }
  .light.red-l .lbl { color: var(--red-strong); }
  .light .desc { font-size: 13.5px; color: var(--ink-700); margin-top: 2px; }

  /* ===== Bottom nav ===== */
  .botnav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;

/* Generic quiz template for symptoms without custom quizzes */
function genericQuiz(s) {
  return [
    { q: `${s.name}持續多久了？`,
      options: [

        { label: "1–3 天", flag: "neutral" },

        { label: "反覆出現好幾週", flag: "amber" },
      ]},
    { q: "嚴重程度大概是？",
      options: [
        { label: "輕微，幾乎沒影響生活", flag: "neutral" },
        { label: "中等，需要休息一下", flag: "neutral" },
        { label: "嚴重，明顯影響工作或睡眠", flag: "amber" },
      ]},
    { q: `有沒有合併以下任一警訊？`, multi: true,
      hint: `若${s.name}合併下列狀況請立即就醫`,
      options: (s.watchOuts || []).slice(0, 4).map(w => ({ label: w, flag: "red" })).concat([{ label: "以上都沒有", flag: "neutral" }])
    },
    { q: "之前有沒有試過自我處理？有改善嗎？",
      options: [
        { label: "有改善，只想了解一下", flag: "neutral" },
        { label: "稍微改善但反覆", flag: "neutral" },
        { label: "完全沒改善或越來越糟", flag: "amber" },
        { label: "還沒試過", flag: "neutral" },
      ]},
  ];
}

/* ====================== ROUTER & STATE ====================== */
const app = document.getElementById("app");
let state = {
  route: { name: "splash" },
  quiz: { symId: null, answers: [], step: 0 },
};

function go(route, replace) {
  state.route = route;
  if (replace) history.replaceState(route, "", "");
  else history.pushState(route, "", "");
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

window.addEventListener("popstate", (e) => {
  if (e.state) { state.route = e.state; render(); }
  else { state.route = { name: "home" }; render(); }
});

/* ====================== RENDER ====================== */
function render() {
  app.innerHTML = "";
  const r = state.route;
  switch (r.name) {
    case "splash":      renderSplash(); break;
    case "onboarding":  renderOnboarding(r.step || 0); break;
    case "home":        renderHome(); break;
    case "redflag":     renderRedFlag(); break;
    case "demographic": renderDemographic(); break;
    case "picker":      renderPicker(); break;
    case "quiz":        renderQuiz(r.symId, r.step || 0); break;
    case "result":      renderResult(r.id); break;
    case "history":     renderHistory(); break;
    case "profile":     renderProfile(); break;
    case "browse":      renderBrowse(); break;
    case "category":    renderCategory(r.id); break;
    case "symdetail":   renderSymDetail(r.id); break;
    case "detail":      renderDetail(r.id); break;
    case "map":         renderMap(); break;
    case "about":       renderAbout(); break;
    default:            renderHome(); break;
  }
  // bottom nav for main pages
  if (["home","browse","history","profile","map"].includes(r.name)) {
    app.appendChild(renderBottomNav());
  }
}

      b.parentElement.querySelectorAll(".chip-btn").forEach(x=>x.classList.remove("selected"));
      b.classList.add("selected");
      const row = b.parentElement.id;
      const v = b.dataset.v;
      if (row === "ageRow") draft.age = v;
      if (row === "sexRow") {
        draft.sex = v;
        c.querySelector("#pregBlock").style.display = (v === "女") ? "" : "none";
        if (v !== "女") draft.pregnant = null;
      }
      if (row === "pregRow") draft.pregnant = v;
    });
  });

  // multi-select chronic
  c.querySelectorAll("#chronicRow .chip-btn").forEach(b => {
    b.addEventListener("click", () => {
      const v = b.dataset.v;
      if (v === "沒有") {
        c.querySelectorAll("#chronicRow .chip-btn").forEach(x => x.classList.remove("selected"));
        b.classList.add("selected");
        draft.chronic = ["沒有"];

        draft.chronic = draft.chronic.filter(x => x !== "沒有");
        if (b.classList.contains("selected")) {
          b.classList.remove("selected");
          draft.chronic = draft.chronic.filter(x => x !== v);
        } else {
          b.classList.add("selected");
          draft.chronic.push(v);
        }
      }
    });
  });

  c.querySelector("#saveDemo").addEventListener("click", () => {
    STORE.set("profile", draft);
    go({ name: "picker" }, true);
  });
  c.querySelector("#skipDemo").addEventListener("click", () => {
    STORE.set("profile", { skipped: true });
    go({ name: "picker" }, true);
  });

  wrap.appendChild(c);
  app.appendChild(wrap);
}

/* ===== Quiz ===== */
function startQuizFor(symId) {
  const profile = STORE.get("profile", null);
  if (!profile) {
    state.quiz = { symId, answers: [], step: 0 };
    go({ name: "demographic" });
    return;
  }
  state.quiz = { symId, answers: [], step: 0 };
  go({ name: "quiz", symId, step: 0 });
}

function getQuiz(symId) {
  const s = SYMPTOMS.find(x => x.id === symId);
  if (!s) return [];
  return QUIZZES[symId] || genericQuiz(s);
}

function renderQuiz(symId, step) {
  const s = SYMPTOMS.find(x => x.id === symId);
  if (!s) { go({ name: "home" }); return; }
  const quiz = getQuiz(symId);
  if (state.quiz.symId !== symId) state.quiz = { symId, answers: [], step: 0 };
  if (step >= quiz.length) {
    finalizeQuiz(symId);
    return;
  }
  const q = quiz[step];

  const wrap = document.createElement("div");
  wrap.className = "page";
  wrap.appendChild(topbarBack(s.name, {
    onBack: () => {
      if (step === 0) history.back();
      else go({ name: "quiz", symId, step: step - 1 }, true);
    }
  }));

  const prog = document.createElement("div");
  prog.className = "quiz-progress";
  prog.innerHTML = `<span style="width:${((step + 1) / quiz.length) * 100}%"></span>`;
  wrap.appendChild(prog);

  const c = document.createElement("div");
  c.className = "quiz-wrap";
  c.innerHTML = `
    <div class="quiz-step">問題 ${step + 1} / ${quiz.length}</div>
    <div class="quiz-q">${q.q}</div>
    ${q.hint ? `<div class="quiz-hint">${q.hint}</div>` : ""}
    <div class="opt-list" id="opts"></div>
    <div class="quiz-actions">
      ${step > 0 ? `<button class="btn-secondary" id="back">上一題</button>` : ""}
      <button class="btn-primary" id="next" disabled style="opacity:0.5">下一題</button>
    </div>
  `;
  const optsEl = c.querySelector("#opts");
  const isMulti = !!q.multi;
  let selectedIdx = isMulti ? new Set() : null;

  q.options.forEach((opt, i) => {
    const ob = document.createElement("button");
    ob.className = "opt" + (isMulti ? " multi" : "");
    ob.innerHTML = `<div class="check">${ICONS.check}</div><span>${opt.label}</span>`;
    ob.addEventListener("click", () => {
      if (isMulti) {
        // "以上都沒有" exclusive
        const isNoneOpt = /^以上都沒有$|^都沒有/.test(opt.label) || /都沒有特別感覺/.test(opt.label);
        if (isNoneOpt) {
          selectedIdx.clear();
          selectedIdx.add(i);
          optsEl.querySelectorAll(".opt").forEach((x,j) => x.classList.toggle("selected", j === i));
        } else {
          // remove "none" if any none-option selected
          q.options.forEach((o2, j) => {
            if (selectedIdx.has(j) && (/^以上都沒有$|^都沒有/.test(o2.label) || /都沒有特別感覺/.test(o2.label))) {
              selectedIdx.delete(j);
              optsEl.querySelectorAll(".opt")[j].classList.remove("selected");
            }
          });
          if (selectedIdx.has(i)) { selectedIdx.delete(i); ob.classList.remove("selected"); }
          else { selectedIdx.add(i); ob.classList.add("selected"); }
        }
        const nextBtn = c.querySelector("#next");
        const has = selectedIdx.size > 0;
        nextBtn.disabled = !has;
        nextBtn.style.opacity = has ? 1 : 0.5;
      } else {
        selectedIdx = i;
        optsEl.querySelectorAll(".opt").forEach((x,j) => x.classList.toggle("selected", j === i));
        const nextBtn = c.querySelector("#next");
        nextBtn.disabled = false;
        nextBtn.style.opacity = 1;
      }
    });
    optsEl.appendChild(ob);
  });

  c.querySelector("#next").addEventListener("click", () => {
    let answer;
    if (isMulti) {
      const arr = [...selectedIdx];
      answer = arr.map(idx => q.options[idx]);
    } else {
      answer = [q.options[selectedIdx]];
    }
    state.quiz.answers[step] = answer;
    if (step + 1 >= quiz.length) finalizeQuiz(symId);
    else go({ name: "quiz", symId, step: step + 1 }, true);
  });
  if (c.querySelector("#back")) {
    c.querySelector("#back").addEventListener("click", () => go({ name: "quiz", symId, step: step - 1 }, true));
  }

  wrap.appendChild(c);
  app.appendChild(wrap);
}

function finalizeQuiz(symId) {
  const s = SYMPTOMS.find(x => x.id === symId);
  const answers = state.quiz.answers;
  // triage
  let light = "green";
  const flatFlags = answers.flat().map(a => a.flag);
  if (flatFlags.includes("red")) light = "red";
  else if (flatFlags.includes("amber")) light = "amber";

  // demographic adjustments — high-risk groups: 嬰兒, 65+, immunocompromised, pregnant + abdominal
  const profile = STORE.get("profile", null);
  if (profile && !profile.skipped) {
    if (profile.age === "嬰兒（<3 個月）" && symId === "fever") light = "red";
    if (profile.age === "嬰兒（<3 個月）" && light === "green") light = "amber";
    if (profile.pregnant === "是" && (symId === "abdominal" || symId === "chestpain")) {
      if (light === "green") light = "amber";
    }
    const chronicHigh = ["免疫疾病","洗腎","心血管疾病","糖尿病"];
    if (Array.isArray(profile.chronic) && profile.chronic.some(c => chronicHigh.includes(c))) {
      if (light === "green" && (symId === "fever" || symId === "chestpain" || symId === "sob")) light = "amber";
    }
  }

  const lightLabel = { red: "紅燈：建議立即就醫", amber: "黃燈：近期預約門診", green: "綠燈：可先觀察自我照護" }[light];
  const record = {
    id: "h_" + Date.now().toString(36),
    symId, name: s.name, light, lightLabel,
    t: Date.now(),
  };
  const history = STORE.get("history", []);
  history.unshift(record);
  STORE.set("history", history.slice(0, 50));
  go({ name: "result", id: record.id }, true);
}

/* ===== Result ===== */
function renderResult(recordId) {
  const history = STORE.get("history", []);
  const rec = history.find(h => h.id === recordId);
  if (!rec) { go({ name: "home" }); return; }
  const s = SYMPTOMS.find(x => x.id === rec.symId);

  const wrap = document.createElement("div");
  wrap.className = "page scroll-area";
  wrap.appendChild(topbarBack("檢查結果"));

  const summary = {
    red: { title: "建議盡快就醫評估", body: `根據你的回答，目前建議盡快尋求專業醫療評估。如果出現嚴重狀況（劇烈胸痛、意識改變、嚴重出血等），請立即撥 119 或前往急診。` },
    amber: { title: "建議近期預約門診", body: `你的症狀有幾個值得醫師評估的徵兆。建議近 1–3 天內預約門診，避免拖延。` },
    green: { title: "可以先自我觀察", body: `目前看來沒有明顯緊急徵兆，可以先在家觀察 1–3 天並注意是否惡化。如果出現下方警示徵兆請立即就醫。` },
  }[rec.light];

  const c = document.createElement("div");
  c.className = "result-wrap";

  const banner = document.createElement("div");
  banner.className = `result-banner ${rec.light}`;
  banner.innerHTML = `
    <div class="light-tag"><span class="dot"></span>${rec.lightLabel}</div>
    <h1>${s.emoji} ${s.name}</h1>
    <p>${summary.body}</p>
  `;
  c.appendChild(banner);

  // recommended action card
  c.appendChild(card("建議行動", "light", `
    <div style="font-size:15px;font-weight:600;color:var(--ink-900);margin-bottom:8px">${summary.title}</div>
    <ul class="bullet">
      ${rec.light === "red" ? `<li>若出現嚴重狀況請撥打 119 或前往最近急診</li>` : ""}
      ${rec.light === "amber" ? `<li>近 1–3 天內預約門診</li><li>記錄症狀變化（時間、強度、誘發因素）</li>` : ""}
      ${rec.light === "green" ? `<li>觀察 1–3 天，注意有無惡化</li><li>充分休息、補水、規律作息</li>` : ""}
      <li>若症狀持續或惡化，回診評估</li>
    </ul>
  `));

  // departments
  let deptHtml = `<div class="chips">${s.depts.map(d => `<span class="chip">${d}</span>`).join("")}</div>`;
  if (s.deptsAlt && s.deptsAlt.length) {
    deptHtml += `<div style="margin-top:12px;font-size:12.5px;color:var(--ink-500);margin-bottom:6px">特殊情況可能轉診：</div>
      <div class="chips">${s.deptsAlt.map(d => `<span class="chip alt">${d}</span>`).join("")}</div>`;
  }
  c.appendChild(card("建議科別", "dept", deptHtml));

  // doctor questions
  c.appendChild(card("給醫生的 3 個關鍵問題", "question", `
    <div class="qlist">${s.questions.map(q => `<div class="qitem">${q}</div>`).join("")}</div>
    <button class="btn-secondary" id="copyQs" style="margin-top:14px">📋 複製問題到剪貼簿</button>
  `));

  // watch outs
  if (s.watchOuts && s.watchOuts.length) {
    const w = document.createElement("div");
    w.className = "watch-card";
    w.innerHTML = `
      <h3>${ICONS.watch} 出現以下狀況請立即就醫</h3>
      <ul class="bullet">
        ${s.watchOuts.map(x => `<li>${x}</li>`).join("")}
      </ul>
    `;
    c.appendChild(w);
  }

  // disclaimer
  const disc = document.createElement("div");
  disc.className = "disclaimer";
  disc.innerHTML = `<strong>提醒：</strong>本結果根據你的回答給出建議，不是診斷。實際病因仍需醫師評估。緊急狀況請撥 119，心理困擾可撥 1925。`;
  c.appendChild(disc);

  // actions
  const acts = document.createElement("div");
  acts.className = "result-actions";
  acts.innerHTML = `
    <button class="btn-primary" id="newCheck">重新檢查</button>
    <button class="btn-secondary" id="goBrowse">查看 ${s.name} 完整衛教</button>
    <button class="btn-ghost" id="goHome">回首頁</button>
  `;
  acts.querySelector("#newCheck").addEventListener("click", () => go({ name: "redflag" }, true));
  acts.querySelector("#goBrowse").addEventListener("click", () => go({ name: "symdetail", id: s.id }));
  acts.querySelector("#goHome").addEventListener("click", () => go({ name: "home" }, true));
  c.appendChild(acts);

  wrap.appendChild(c);
  app.appendChild(wrap);

  // copy
  const copyBtn = wrap.querySelector("#copyQs");
  if (copyBtn) {
    copyBtn.addEventListener("click", () => {
      const txt = `關於我的「${s.name}」，想請教醫生：\n` + s.questions.map((q,i) => `${i+1}. ${q}`).join("\n");
      navigator.clipboard?.writeText(txt).then(() => showToast("已複製到剪貼簿"));
    });
  }

  // auto-saved already; show toast
  showToast("已儲存到紀錄");
}

function card(title, iconKey, innerHtml) {
  const el = document.createElement("div");
  el.className = "result-card";
  el.innerHTML = `<h3><span class="ico">${ICONS[iconKey] || ICONS.info}</span>${title}</h3>${innerHtml}`;
  return el;
}

/* ===== Health Journal (合併健康日記 + 就診紀錄) ===== */
const MOODS = ["😔","😕","😐","🙂","😄"];
const SEV_LABELS = ["","輕微","輕中","中等","較重","嚴重"];
const QUICK_SYMS = ["頭痛","發燒","咳嗽","喉嚨痛","疲倦","腹痛","噁心","頭暈","失眠","焦慮","背痛","流鼻水"];

function renderHistory() {
  const wrap = document.createElement("div");
  wrap.className = "page scroll-area";
  wrap.style.paddingBottom = "100px";

  // topbar
  const tb = document.createElement("div");
  tb.className = "topbar";
  tb.innerHTML = `<div class="title" style="font-size:18px;font-weight:700;color:var(--mint-700)">健康紀錄</div>`;
  wrap.appendChild(tb);

  // tab bar
  const activeTab = state.route.tab || "diary";
  const tabBar = document.createElement("div");
  tabBar.className = "tab-bar";
  tabBar.innerHTML = `
    <button class="tab-btn ${activeTab==='diary'?'active':''}" id="tabDiary">📋 健康日記</button>
    <button class="tab-btn ${activeTab==='visit'?'active':''}" id="tabVisit">🏥 就診紀錄</button>
  `;
  wrap.appendChild(tabBar);

  // content area
  const content = document.createElement("div");
  content.id = "journalContent";
  wrap.appendChild(content);

  function switchTab(tab) {
    state.route.tab = tab;
    wrap.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    wrap.querySelector(tab==="diary" ? "#tabDiary" : "#tabVisit").classList.add("active");
    renderTabContent(tab, content, wrap);
  }

  tabBar.querySelector("#tabDiary").addEventListener("click", () => switchTab("diary"));
  tabBar.querySelector("#tabVisit").addEventListener("click", () => switchTab("visit"));

  renderTabContent(activeTab, content, wrap);
  app.appendChild(wrap);

  // FAB
  const fab = document.createElement("button");
  fab.className = "add-fab";
  fab.textContent = "+";
  fab.addEventListener("click", () => {
    const currentTab = state.route.tab || "diary";
    if (currentTab === "diary") showDiaryForm();
    else showVisitForm();
  });
  app.appendChild(fab);
}

function renderTabContent(tab, content, wrap) {
  content.innerHTML = "";
  if (tab === "diary") renderDiaryTab(content);
  else renderVisitTab(content);
}

/* --- 健康日記 tab --- */
function renderDiaryTab(container) {
  const entries = STORE.get("diary", []);

  // 症狀檢查紀錄（原有）
  const checks = STORE.get("history", []);

  if (!entries.length && !checks.length) {
    container.appendChild(emptyState("📖", "還沒有日記", "點右下角 ＋ 記錄今天的健康狀況"));
    return;
  }

  if (entries.length) {
    const list = document.createElement("div");
    list.className = "journal-list";
    [...entries].sort((a,b) => b.t - a.t).forEach(e => {
      const card = document.createElement("div");
      card.className = "journal-card";
      const sevClass = `s${e.sev||1}`;
      card.innerHTML = `
        <div class="jc-top">
          <span class="jc-date">${formatDateShort(e.date)}</span>
          <span class="jc-mood">${MOODS[(e.mood||3)-1]}</span>
          ${e.sev ? `<span class="jc-sev ${sevClass}">${SEV_LABELS[e.sev]}</span>` : ""}
        </div>
        ${e.syms && e.syms.length ? `<div class="jc-syms">${e.syms.map(s=>`<span class="jc-sym-tag">${s}</span>`).join("")}</div>` : ""}
        ${e.note ? `<div class="jc-note">${escapeHtml(e.note)}</div>` : ""}
      `;
      // swipe-like delete via long press
      let del = document.createElement("button");
      del.style.cssText = "float:right;background:none;border:none;color:var(--ink-300);font-size:16px;cursor:pointer;padding:0 0 8px 8px";
      del.textContent = "✕";
      del.addEventListener("click", e2 => {
        e2.stopPropagation();
        if (confirm("刪除這筆日記？")) {
          const d = STORE.get("diary", []).filter(x => x.id !== e.id);
          STORE.set("diary", d); renderTabContent("diary", container.parentElement.querySelector("#journalContent"), container.parentElement);
        }
      });
      card.prepend(del);
      list.appendChild(card);
    });
    container.appendChild(list);
  }

  // 症狀檢查紀錄摺疊區
  if (checks.length) {
    const sec = document.createElement("div");
    sec.style.padding = "18px 20px 0";
    sec.innerHTML = `<div class="block-head" style="margin-bottom:8px"><h2>症狀檢查紀錄</h2></div>`;
    const list2 = document.createElement("div");
    checks.slice(0,5).forEach(h => list2.appendChild(historyItem(h)));
    sec.appendChild(list2);
    if (checks.length > 5) {
      const more = document.createElement("div");
      more.style.cssText = "text-align:center;font-size:13px;color:var(--ink-400);padding:8px 0";
      more.textContent = `還有 ${checks.length-5} 筆…`;
      sec.appendChild(more);
    }
    container.appendChild(sec);
  }
}

    del.addEventListener("click", e2 => {

/* --- 健康日記表單 --- */
function showDiaryForm(prefill) {
  const sheet = document.createElement("div");
  sheet.className = "form-sheet";
  const today = new Date().toISOString().slice(0,10);
  let selMood = prefill?.mood || 3;
  let selSev  = prefill?.sev  || 1;
  let selSyms = new Set(prefill?.syms || []);

  const SEV3 = [
    { v:1, label:"還好", icon:"🟢" },
    { v:3, label:"有點不適", icon:"🟡" },
    { v:5, label:"很不舒服", icon:"🔴" },
  ];

  sheet.innerHTML = `
    <div class="form-inner">
      <div class="diary-datebar">
        <span class="diary-datebar-label">記錄日期</span>
        <input type="date" id="fi-date" value="${prefill?.date||today}">
      </div>

      <div class="form-group">
        <div class="form-question">今天心情怎麼樣？</div>
        <div class="mood-row" id="fi-mood">
          ${MOODS.map((m,i)=>`<button class="mood-btn${selMood===i+1?' sel':''}" data-mood="${i+1}">${m}</button>`).join("")}
        </div>
      </div>

      <div class="form-group">
        <div class="form-question">身體狀況</div>
        <div class="sev-row" id="fi-sev">
          ${SEV3.map(s=>`<button class="sev-btn${selSev===s.v?' sel':''}" data-sev="${s.v}">${s.icon} ${s.label}</button>`).join("")}
        </div>
      </div>

      <div class="form-group">
        <div class="form-question">有哪些不舒服？<span style="font-weight:400;color:var(--ink-400);font-size:13px">（可跳過）</span></div>
        <div class="sym-chips" id="fi-syms">
          ${QUICK_SYMS.map(s=>`<button class="sym-chip${selSyms.has(s)?' sel':''}" data-sym="${s}">${s}</button>`).join("")}
        </div>
      </div>

      <div class="form-group">
        <div class="form-question">備註</div>
        <textarea class="form-input" id="fi-note" rows="4" placeholder="今天吃了什麼藥、去哪看診、有什麼想記錄的…" style="resize:none;line-height:1.6">${prefill?.note ? escapeHtml(prefill.note) : ''}</textarea>
      </div>

      <button class="btn-primary lg" id="fi-save" style="margin-bottom:10px">儲存</button>
      <button class="btn-ghost" id="fi-cancel">取消</button>
    </div>
  `;

  document.body.appendChild(sheet);

  sheet.querySelectorAll(".mood-btn").forEach(b => {
    b.addEventListener("click", () => {
      selMood = +b.dataset.mood;
      sheet.querySelectorAll(".mood-btn").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
    });
  });
  sheet.querySelectorAll(".sev-btn").forEach(b => {
    b.addEventListener("click", () => {
      selSev = +b.dataset.sev;
      sheet.querySelectorAll(".sev-btn").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
    });
  });
  sheet.querySelectorAll(".sym-chip").forEach(b => {
    b.addEventListener("click", () => {
      const s = b.dataset.sym;
      if (selSyms.has(s)) { selSyms.delete(s); b.classList.remove("sel"); }
      else { selSyms.add(s); b.classList.add("sel"); }
    });
  });

  sheet.querySelector("#fi-save").addEventListener("click", () => {
    const date = sheet.querySelector("#fi-date").value;
    const note = sheet.querySelector("#fi-note").value.trim();
    const entry = {
      id: "d_" + Date.now().toString(36),
      date, mood: selMood, sev: selSev, syms: [...selSyms], note, t: Date.now()
    };
    const diary = STORE.get("diary", []);
    diary.unshift(entry);
    STORE.set("diary", diary);
    sheet.remove();
    showToast("已儲存");
    render();
  });
  sheet.querySelector("#fi-cancel").addEventListener("click", () => sheet.remove());
  sheet.addEventListener("click", e => { if (e.target === sheet) sheet.remove(); });
}

/* --- 就診記錄表單 --- */
function showVisitForm() {
  const sheet = document.createElement("div");

function formatDateShort(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  const today = new Date();
  const diff = Math.floor((today - d) / 86400000);
  const mm = d.getMonth()+1, dd = d.getDate();
  if (diff === 0) return "今天";
  if (diff === 1) return "昨天";
  if (d.getFullYear() === today.getFullYear()) return `${mm}/${dd}`;
  return `${d.getFullYear()}/${mm}/${dd}`;
}

/* ===== Map page ===== */
let _leafletLoaded = false;
let _mapInstance   = null;
const MAP_TYPES = {
  hospital:  { label:"醫院",   color:"#D45B5B", emoji:"🏥" },
  clinic:    { label:"診所",   color:"#4F9985", emoji:"🩺" },
  pharmacy:  { label:"藥局",   color:"#5B8DD4", emoji:"💊" },
  emergency: { label:"急診",   color:"#D4935B", emoji:"🚨" },
};
let _mapFilters = new Set(Object.keys(MAP_TYPES));
let _mapMarkers = {};   // type → L.LayerGroup

function renderMap() {
  if (_mapInstance) { try { _mapInstance.remove(); } catch(e){} _mapInstance = null; }

  const wrap = document.createElement("div");
  wrap.className = "map-page";

  // topbar
  const tb = document.createElement("div");
  tb.className = "topbar";
  tb.innerHTML = `<div class="title" style="font-size:18px;font-weight:700;color:var(--mint-700)">附近醫療院所</div>`;
  wrap.appendChild(tb);

  // filter bar
  const fb = document.createElement("div");
  fb.className = "map-filter-bar";
  Object.entries(MAP_TYPES).forEach(([k, v]) => {
    const btn = document.createElement("button");
    btn.className = "map-filter-btn" + (_mapFilters.has(k) ? " on" : "");
    btn.textContent = v.emoji + " " + v.label;
    btn.dataset.type = k;
    btn.addEventListener("click", () => {
      if (_mapFilters.has(k)) _mapFilters.delete(k); else _mapFilters.add(k);
      btn.classList.toggle("on");
      Object.entries(_mapMarkers).forEach(([type, group]) => {
        if (_mapFilters.has(type)) group.addTo(_mapInstance);
        else group.remove();
      });
    });
    fb.appendChild(btn);
  });
  wrap.appendChild(fb);

  // map container
  const mapEl = document.createElement("div");
  mapEl.id = "leaflet-map";
  wrap.appendChild(mapEl);

  // loading overlay
  const loading = document.createElement("div");
  loading.className = "map-loading";
  loading.innerHTML = `<div class="map-spinner"></div><div>正在取得位置…</div>`;
  mapEl.appendChild(loading);

  // legend
  const legend = document.createElement("div");
  legend.className = "map-legend";
  legend.innerHTML = Object.values(MAP_TYPES).map(v =>
    `<div class="map-legend-row"><div class="map-dot" style="background:${v.color}"></div>${v.label}</div>`
  ).join("");
  wrap.appendChild(legend);

  app.appendChild(wrap);

  function initWithCoords(lat, lng) {
    loadLeaflet(() => {
      loading.remove();
      const L = window.L;
      _mapInstance = L.map("leaflet-map", { zoomControl: true }).setView([lat, lng], 15);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors", maxZoom: 19
      }).addTo(_mapInstance);

      // user marker
      L.circleMarker([lat, lng], {
        radius: 9, fillColor: "#fff", color: "#4F9985", weight: 3, fillOpacity: 1
      }).addTo(_mapInstance).bindPopup("你在這裡");

      // init layer groups
      Object.keys(MAP_TYPES).forEach(k => {
        _mapMarkers[k] = L.layerGroup().addTo(_mapInstance);
      });

      fetchNearby(lat, lng, L);
    });
  }

  function fetchNearby(lat, lng, L) {
    const r = 2500;
    const q = `[out:json][timeout:15];
(
  node["amenity"="hospital"](around:${r},${lat},${lng});
  way["amenity"="hospital"](around:${r},${lat},${lng});
  node["amenity"="clinic"](around:${r},${lat},${lng});
  way["amenity"="clinic"](around:${r},${lat},${lng});
  node["amenity"="doctors"](around:${r},${lat},${lng});
  node["amenity"="pharmacy"](around:${r},${lat},${lng});
  way["amenity"="pharmacy"](around:${r},${lat},${lng});
  node["emergency"="yes"](around:${r},${lat},${lng});
  node["amenity"="hospital"]["emergency"="yes"](around:${r},${lat},${lng});
);
out center;`;

    fetch("https://overpass-api.de/api/interpreter", {
      method: "POST", body: q
    }).then(r => r.json()).then(data => {
      data.elements.forEach(el => {
        const elLat = el.lat ?? el.center?.lat;
        const elLng = el.lon ?? el.center?.lon;
        if (!elLat || !elLng) return;
        const tags = el.tags || {};
        const name = tags.name || tags["name:zh"] || tags["name:en"] || "（無名稱）";

        let type = "clinic";
        if (tags.amenity === "hospital" || tags.emergency === "yes") type = "hospital";
        if (tags.amenity === "pharmacy") type = "pharmacy";
        if (tags.emergency === "yes" && tags.amenity === "hospital") type = "emergency";

        const cfg = MAP_TYPES[type];
        const icon = L.divIcon({
          className: "",
          html: `<div style="width:28px;height:28px;background:${cfg.color};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.25);border:2px solid #fff">${cfg.emoji}</div>`,
          iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -16]
        });

        const gmLink = `https://maps.google.com/?q=${encodeURIComponent(name)}&ll=${elLat},${elLng}`;
        const marker = L.marker([elLat, elLng], { icon })
          .bindPopup(`<div class="map-popup-name">${name}</div><div class="map-popup-type">${cfg.emoji} ${cfg.label}</div><a class="map-popup-nav" href="${gmLink}" target="_blank">Google Maps 導航</a>`);

        if (_mapMarkers[type]) {
          marker.addTo(_mapMarkers[type]);
          if (!_mapFilters.has(type)) _mapMarkers[type].remove();
        }
      });
    }).catch(() => {
      showToast("資料載入失敗，請稍後再試");
    });
  }

  // get location
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => initWithCoords(pos.coords.latitude, pos.coords.longitude),
      ()  => {
        loading.innerHTML = `<div style="font-size:28px">📍</div><div>無法取得位置<br><span style="font-size:12px;color:var(--ink-400)">請允許位置權限後重新整理</span></div>`;
      },
      { timeout: 8000 }
    );
  } else {
    loading.innerHTML = `<div>此裝置不支援定位</div>`;
  }
}

function loadLeaflet(cb) {
  if (_leafletLoaded && window.L) { cb(); return; }
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
  document.head.appendChild(link);
  const script = document.createElement("script");
  script.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  script.onload = () => { _leafletLoaded = true; cb(); };
  document.head.appendChild(script);
}

/* ===== Toast ===== */
function showToast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2300);
}

/* ===== Util ===== */
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function formatDate(t) {
  const d = new Date(t);
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  const yest = new Date(today); yest.setDate(today.getDate() - 1);
  const isYest = d.toDateString() === yest.toDateString();
  const hh = String(d.getHours()).padStart(2,"0"), mm = String(d.getMinutes()).padStart(2,"0");
  if (sameDay) return `今天 ${hh}:${mm}`;
  if (isYest) return `昨天 ${hh}:${mm}`;
  return `${d.getMonth()+1}/${d.getDate()} ${hh}:${mm}`;
}
